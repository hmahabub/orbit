{% extends "base.html" %}
{% load orbit %}
{% block title %}Sign in · Orbit ERP{% endblock %}
{% block main_class %}{% endblock %}
{% block content %}
<div class="erp-login-wrap">
  <div class="erp-login-card">
    <div class="text-center mb-4">
      <img src="{% asset 'image/orbit_logo.png' %}" alt="Orbit" class="login-logo">
      <small class="text-muted">Orders · Assortment · BOM · Costing · Supplier PO</small>
    </div>
    {% if form.errors %}<div class="alert alert-danger py-2">Invalid username or password.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <input class="form-control" id="id_username" name="username" autofocus required value="{{ form.username.value|default:'' }}">
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Password</label>
        <input class="form-control" type="password" id="id_password" name="password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-erp-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
