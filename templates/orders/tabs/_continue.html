{# params: next_stage, next_key, next_label, hint, can_continue #}
<div class="continue-bar">
  <span class="text-muted small">{{ hint }}</span>
  {% if order.stage >= next_stage %}
    {% if is_admin or next_key != 'costing' and next_key != 'po' %}
      <a class="btn btn-outline-primary" href="?tab={{ next_key }}{% if line %}&line={{ line.pk }}{% endif %}">{{ next_label }} <i class="bi bi-arrow-right"></i></a>
    {% else %}
      <span class="badge text-bg-light border"><i class="bi bi-shield-lock"></i> Costing and supplier POs are with admin</span>
    {% endif %}
  {% else %}
    <form method="post" action="{% url 'advance' order.pk next_stage %}">{% csrf_token %}
      <button class="btn btn-erp-primary" {% if not can_continue %}disabled title="Complete this step first"{% endif %}>
        <i class="bi bi-check2-circle"></i> Complete &amp; continue to {{ next_label }}
      </button>
    </form>
  {% endif %}
</div>
